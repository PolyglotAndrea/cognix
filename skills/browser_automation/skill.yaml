name: browser_automation
version: 0.1.0
description: Define compliant browser automation jobs, approval gates, login/session policy, extraction strategy, artifact contracts, and recovery rules. This skill does not execute browser actions.
author: cognix-team
tags:
  - browser
  - automation
  - playwright
  - browser-use
  - mcp
  - crawler
  - scrape
  - extraction
  - artifact
  - compliance

runtime:
  python: ">=3.11"
  entrypoint: handler.py

tools:
  - name: plan_browser_task
    description: Build a compliant browser automation plan with approval gates, capability routing, and expected artifacts.
    access_level: read
    parameters:
      type: object
      properties:
        objective:
          type: string
          description: User-facing task objective.
        source_url:
          type: string
          description: Optional target page, domain, or system URL.
        data_needed:
          type: array
          description: Fields or content the user expects to collect.
          items:
            type: string
        authorization_confirmed:
          type: boolean
          description: Whether the user confirmed legal authorization to access and collect the target data.
          default: false
        preferred_route:
          type: string
          description: Preferred acquisition route.
          enum: [api, export_file, browser, unknown]
          default: unknown
        constraints:
          type: array
          description: Known constraints such as rate limits, login requirements, or allowed domains.
          items:
            type: string
      required: [objective]
  - name: browser_task_contract
    description: Return the canonical contract that Planner must follow before routing work to the internal Browser MCP runtime.
    access_level: read
    parameters:
      type: object
      properties:
        task_type:
          type: string
          description: Browser task category.
          enum: [data_extraction, form_workflow, download_export, research_capture]
          default: data_extraction
        requires_login:
          type: boolean
          default: false
        handles_sensitive_data:
          type: boolean
          default: false
        output_format:
          type: string
          enum: [report, dataset, screenshot_bundle, exported_file]
          default: dataset
  - name: browser_result_template
    description: Create an artifact schema for browser automation results.
    access_level: read
    parameters:
      type: object
      properties:
        objective:
          type: string
        artifact_type:
          type: string
          enum: [dataset, report, checklist]
          default: dataset
        fields:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
      required: [objective]
  - name: normalize_browser_observations
    description: Normalize browser observations or extracted rows into an artifact-ready structure.
    access_level: read
    parameters:
      type: object
      properties:
        observations:
          description: Browser observations, extracted records, or raw text.
        fields:
          type: array
          items:
            type: string
        source_url:
          type: string
      required: [observations]
  - name: browser_error_recovery
    description: Convert browser runtime failures into user-facing recovery guidance and retry strategy.
    access_level: read
    parameters:
      type: object
      properties:
        error:
          type: string
        engine:
          type: string
          enum: [playwright, cdp, browser_use, unknown]
          default: unknown
        url:
          type: string
        operation:
          type: string
      required: [error]
