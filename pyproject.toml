[project]
name = "cognix"
version = "0.1.0"
description = "Hermes Agent-based multi-agent collaboration platform with scheduling, RPC, and skills"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # Web / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # CLI
    "typer>=0.9",
    "rich>=13.0",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    # Scheduler
    "apscheduler>=3.10",
    # LLM
    "litellm>=1.30",
    "claude-agent-sdk>=0.2.111",
    # HTTP client
    "httpx>=0.27",
    # WebSocket
    "websockets>=12.0",
    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    # Billing
    "stripe>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]
redis = [
    "redis>=5.0",
    "arq>=0.26",
]

[project.scripts]
cognix = "cognix.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
