site_name: Cognix
site_description: Hermes Agent-based multi-agent collaboration platform
site_url: https://cognix.build
repo_url: https://github.com/PolyglotAndrea/cognix
repo_name: PolyglotAndrea/cognix

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quickstart.md
  - Guides:
    - Agent Management: guides/agents.md
    - Task Scheduling: guides/tasks.md
    - Skills System: guides/skills.md
    - Workflows: guides/workflows.md
    - Authentication: guides/authentication.md
    - Billing: guides/billing.md
  - Architecture:
    - Overview: architecture/overview.md
    - Core Modules: architecture/core.md
    - Orchestration: architecture/orchestration.md
    - API Server: architecture/api.md
    - Storage: architecture/storage.md
  - API Reference:
    - Auth: api/auth.md
    - Agents: api/agents.md
    - Tasks: api/tasks.md
    - Skills: api/skills.md
    - Workspaces: api/workspaces.md
    - Approvals: api/approvals.md
    - Billing: api/billing.md
    - RPC: api/rpc.md
  - Tutorials:
    - Create Your First Agent: tutorials/first-agent.md
    - Build a Workflow: tutorials/workflow.md
    - Develop a Skill: tutorials/custom-skill.md
    - Deploy to Production: tutorials/deployment.md
